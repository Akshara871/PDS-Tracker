
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PDS Tracker</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f4;
        }

        .login-container {
            max-width: 420px;
            margin: 65px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        .login-container h1 {
            text-align: center;
            color: #123c35;
            margin-bottom: 10px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .login-container label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .login-container button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #176b55;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #104c3d;
        }

        #loginMessage {
            text-align: center;
            margin-top: 15px;
        }

        .login-links {
            text-align: center;
            margin-top: 20px;
        }

        .login-links a {
            color: #176b55;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">PDS <span>Tracker</span></div>
</header>

<main class="login-container">

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Login to your PDS Tracker account
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

        <p id="loginMessage"></p>

    </form>

    <div class="login-links">
        Don't have an account?
        <a href="register.html">Register Here</a>
    </div>

    <div class="back-home">
        <a href="index.html">← Back to Home</a>
    </div>

</main>

<script src="js/script.js"></script>

</body>
</html>
