
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Dashboard - PDS Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">PDS <span>Tracker</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="admin.html">Admin</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</header>

<main class="dashboard">
    <h1>Shop Dealer Dashboard</h1>
    <p>Manage your ration shop stock and operating status.</p>

    <section class="dashboard-card">
        <h2>Shop Information</h2>
        <p><b>Shop Name:</b> PDS Test Ration Shop</p>
        <p><b>Location:</b> MP Nagar, Bhopal</p>

        <label for="shopStatus">Shop Status</label>
        <select id="shopStatus">
            <option value="OPEN">Open</option>
            <option value="CLOSED">Closed</option>
        </select>
        <button id="saveStatus">Update Shop Status</button>
    </section>

    <section class="dashboard-card">
        <h2>Update Commodity Stock</h2>

        <label for="commodity">Select Commodity</label>
        <select id="commodity">
            <option value="rice">Rice</option>
            <option value="wheat">Wheat</option>
            <option value="sugar">Sugar</option>
        </select>

        <label for="quantity">Available Quantity (Kg)</label>
        <input type="number" id="quantity" min="0" step="0.01"
               placeholder="Enter quantity">

        <button id="updateStock">Update Stock</button>
        <p id="message"></p>
    </section>

    <section class="dashboard-card">
        <h2>Current Stock</h2>
        <div id="stockDisplay"></div>
    </section>
</main>

<script src="js/dealer.js"></script>
</body>
</html>
